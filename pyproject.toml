[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dice"
version = "0.2.0"
description = "A cross-encoder decision engine that answers typed questions about a state."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["decision-engine", "cross-encoder", "zero-shot", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.24",
  "sentence-transformers>=3.0",
  "torch>=2.1",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
dice = "dice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dice"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
